spring.application.name=mini-hibernate

# 실습 0. 파이프라인 관측용 로깅
# createQuery -> SQM 덤프 -> SQL AST 덤프 -> 최종 SQL 순서로 찍히는 것 자체가 발표에서 설명하는 파이프라인이다
# 문서에는 DEBUG로 적혀 있지만 Hibernate 7.4에서 덤프 출력이 TRACE로 내려갔다. DEBUG로 두면 아무것도 안 찍힌다
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.query.hql=TRACE
logging.level.org.hibernate.orm.query.sqm.ast=TRACE
logging.level.org.hibernate.orm.sql.ast.create=TRACE
# 카테고리 끝의 AST는 대문자다. 완화된 바인딩 때문에 이 키가 안 먹을 수 있어 logback-spring.xml에도 선언해 뒀다
logging.level.org.hibernate.orm.results.graph.AST=TRACE

spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.hibernate.ddl-auto=create

# DataSource는 테스트의 Testcontainers(@ServiceConnection)가 채운다. main에서 띄우지 않는다
spring.docker.compose.enabled=false
